global
    maxconn 1000

defaults
    mode tcp
    retries 2
    timeout connect 4s
    timeout client 30m
    timeout server 30m
    timeout check 3s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

# Для балансировщика Yandex Cloud: 200, если в кластере есть лидер на запись, иначе 503
frontend health
    mode http
    bind *:8404
    monitor-uri /health
    monitor fail if { nbsrv(primary) lt 1 }

listen primary
    bind *:5432
    option httpchk OPTIONS /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server node1 172.20.0.11:5432 maxconn 200 check port 8008
    server node2 172.20.0.12:5432 maxconn 200 check port 8008
    server node3 172.20.0.13:5432 maxconn 200 check port 8008

listen replicas
    bind *:5001
    balance roundrobin
    option httpchk OPTIONS /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server node1 172.20.0.11:5432 maxconn 200 check port 8008
    server node2 172.20.0.12:5432 maxconn 200 check port 8008
    server node3 172.20.0.13:5432 maxconn 200 check port 8008
